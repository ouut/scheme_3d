[package]
name = "scheme_3d"
version = "0.1.0"
edition = "2021"
description = "Macroquad 2D/3D graphics and input bindings for Steel Scheme"
license = "MIT OR Apache-2.0"

[features]
default = []
audio = ["macroquad/audio"]

[dependencies]
macroquad = { version = "0.4", default-features = false }
steel-core = "0.8.3"
steel-derive = "0.8.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4", features = ["derive"] }
notify = "6"

[profile.dev.package."*"]
opt-level = 3
