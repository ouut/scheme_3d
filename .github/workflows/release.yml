name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: scheme_3d
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: scheme_3d.exe
            archive_ext: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: scheme_3d
            archive_ext: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libx11-dev libxi-dev libgl1-mesa-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Verify builds and tests
        run: cargo test --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package release archive (Unix)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          file "target/${{ matrix.target }}/release/${{ matrix.bin_name }}"
          TAG="${GITHUB_REF_NAME}"
          PKG_DIR="scheme_3d-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/${PKG_DIR}/docs"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "dist/${PKG_DIR}/"
          chmod +x "dist/${PKG_DIR}/${{ matrix.bin_name }}"
          cp README.md "dist/${PKG_DIR}/"
          cp docs/API_REFERENCE.md "dist/${PKG_DIR}/docs/"
          cp -r examples "dist/${PKG_DIR}/"
          tar -C dist -czf "dist/${PKG_DIR}.tar.gz" "${PKG_DIR}"

      - name: Package release archive (Windows)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $pkgDir = "scheme_3d-$tag-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$pkgDir/docs" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" -Destination "dist/$pkgDir/"
          Copy-Item "README.md" -Destination "dist/$pkgDir/"
          Copy-Item "docs/API_REFERENCE.md" -Destination "dist/$pkgDir/docs/"
          Copy-Item -Recurse "examples" -Destination "dist/$pkgDir/"
          Compress-Archive -Path "dist/$pkgDir" -DestinationPath "dist/$pkgDir.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd artifacts
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt
          ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
