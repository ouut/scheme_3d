name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (x86_64)
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            clippy: true
          - name: Windows (x86_64 MSVC)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            clippy: false
          - name: macOS Apple Silicon (M-chip arm64)
            os: macos-latest
            target: aarch64-apple-darwin
            clippy: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libx11-dev libxi-dev libgl1-mesa-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Check formatting and Clippy
        if: matrix.clippy
        run: cargo clippy --target ${{ matrix.target }} --all-targets -- -D warnings

      - name: Check compilation
        run: cargo check --target ${{ matrix.target }} --all-targets

      - name: Run unit & integration tests
        run: cargo test --target ${{ matrix.target }}
